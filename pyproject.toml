[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "meetple-ai-service"
version = "0.1.0"
description = "Meetple 자연어 모임 검색: LangGraph, MCP, OpenAI"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "langgraph>=1,<2", "mcp>=1.20,<2",
  "openai>=2,<3", "httpx>=0.28,<1", "pydantic-settings>=2,<3", "tzdata>=2025.1",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.12,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
